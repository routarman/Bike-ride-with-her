<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Long Drive With Her — a cinematic journey."
    >

    <title>Long Drive With Her</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ======================================
         MAIN EXPERIENCE
    ======================================= -->

    <main class="experience">


        <!-- BACKGROUND IMAGE -->

        <div class="background">

            <img
                id="backgroundImage"
                src="assets/bike-day-desktop.png"
                alt="Motorcycle ride through the mountains"
            >

        </div>


        <!-- DARK CINEMATIC OVERLAY -->

        <div class="cinematic-overlay"></div>


        <!-- FILM GRAIN -->

        <div class="film-grain"></div>


        <!-- ==================================
             TOP LEFT CLOCK
        =================================== -->

        <div class="clock">

            <div
                id="time"
                class="time"
            >
                00:00:00
            </div>

            <div class="location">
                INDIA · IST
            </div>

        </div>


        <!-- ==================================
             TOP RIGHT DAY / NIGHT
        =================================== -->

        <div class="mode-switch">

            <button
                id="dayBtn"
                class="mode active"
                type="button"
            >

                <span>☀</span>
                DAY

            </button>


            <button
                id="nightBtn"
                class="mode"
                type="button"
            >

                <span>☾</span>
                NIGHT

            </button>

        </div>


        <!-- ==================================
             CENTER CONTENT
        =================================== -->

        <section class="center-content">


            <div class="small-label">
                A JOURNEY FOR TWO
            </div>


            <h1>

                <span class="title-main">
                    LONG DRIVE
                </span>

                <span class="title-italic">
                    WITH HER
                </span>

            </h1>


            <div class="divider">

                <span></span>

                <small>♡</small>

                <span></span>

            </div>


            <p class="tagline">

                one road · two hearts · endless miles

            </p>


            <!-- ==================================
                 MUSIC PLAYER
            =================================== -->

            <div class="music-player">


                <div class="now-playing">
                    NOW PLAYING
                </div>


                <div class="music-info">


                    <div class="album-art">

                        <span>♪</span>

                    </div>


                    <div class="song-details">

                        <div
                            id="songTitle"
                            class="song-title"
                        >
                            Long Drive
                        </div>

                        <div
                            id="artistName"
                            class="artist"
                        >
                            Cinesutrachitra
                        </div>

                    </div>


                </div>


                <!-- PROGRESS -->

                <div class="progress-area">

                    <span
                        id="currentTime"
                        class="music-time"
                    >
                        0:00
                    </span>


                    <input
                        id="progress"
                        class="progress"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                    >


                    <span
                        id="duration"
                        class="music-time"
                    >
                        0:00
                    </span>

                </div>


                <!-- CONTROLS -->

                <div class="music-controls">


                    <button
                        id="previousBtn"
                        type="button"
                        aria-label="Previous song"
                    >
                        ◀
                    </button>


                    <button
                        id="playBtn"
                        class="play-button"
                        type="button"
                        aria-label="Play music"
                    >
                        ▶
                    </button>


                    <button
                        id="nextBtn"
                        type="button"
                        aria-label="Next song"
                    >
                        ▶
                    </button>


                </div>


            </div>


        </section>


        <!-- ==================================
             QUOTE
        =================================== -->

        <div class="quote-box">


            <button
                id="quoteRefresh"
                class="quote-refresh"
                type="button"
                aria-label="New quote"
            >
                ↻
            </button>


            <div
                id="quote"
                class="quote"
            >

                "कुछ रास्ते मंज़िल के लिए नहीं,
                किसी के साथ चलने के लिए होते हैं।"

            </div>


            <div class="quote-author">

                — cinesutrachitra

            </div>


        </div>


        <!-- ==================================
             SIGNATURE
        =================================== -->

        <div class="signature">

            cinesutrachitra

        </div>


        <!-- ==================================
             SMALL BOTTOM INDICATOR
        =================================== -->

        <div class="bottom-note">

            KEEP RIDING · KEEP LOVING

        </div>


    </main>


    <!-- ======================================
         AUDIO
    ======================================= -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
