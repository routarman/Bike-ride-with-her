<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Long Drive With Her — Now Playing Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital@1&family=Jost:wght@300;400;500;600&display=swap');

  :root{
    --sky-deep:#1c2b3a;
    --dusk-amber:#e3b46a;
    --dusk-amber-soft:#c99a58;
    --cream:#f4ecd9;
    --cream-dim:#d9cdb2;
    --overlay-black:rgba(10,8,6,0.55);
    --glass-bg:rgba(20,16,12,0.55);
    --glass-border:rgba(230,200,150,0.35);
    --radius-lg:22px;
    --radius-full:999px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Jost', sans-serif;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:24px;
  }

  .poster{
    position:relative;
    width:100%;
    max-width:1200px;
    aspect-ratio:15/11;
    border-radius:6px;
    overflow:hidden;
    color:var(--cream);
    /* Simulated dusk mountain-road backdrop in lieu of the source photo */
    background:
      radial-gradient(ellipse 60% 40% at 50% 78%, rgba(0,0,0,0.55), transparent 70%),
      linear-gradient(180deg, rgba(8,10,14,0.15) 0%, rgba(8,10,14,0.05) 30%, rgba(10,8,6,0.55) 78%, rgba(6,5,4,0.85) 100%),
      linear-gradient(160deg, #4a5f6e 0%, #6b7f82 18%, #8a8f76 32%, #4f5540 48%, #3a3f30 60%, #26241d 78%, #17140f 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
    transition:border-radius .2s ease;
  }

  /* faint road + silhouette suggestion, purely decorative gradients */
  .poster::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(190deg, transparent 55%, rgba(0,0,0,0.35) 62%, rgba(0,0,0,0.65) 100%),
      radial-gradient(ellipse 26% 55% at 50% 68%, rgba(0,0,0,0.75), transparent 72%);
    pointer-events:none;
  }

  .poster::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse 90% 70% at 50% 20%, rgba(255,240,210,0.10), transparent 60%);
    mix-blend-mode:screen;
    pointer-events:none;
  }

  .layer{
    position:absolute; inset:0;
    padding:clamp(20px,3.5vw,44px);
    padding-top:calc(clamp(20px,3.5vw,44px) + env(safe-area-inset-top));
    padding-bottom:calc(clamp(20px,3.5vw,44px) + env(safe-area-inset-bottom));
    padding-left:calc(clamp(20px,3.5vw,44px) + env(safe-area-inset-left));
    padding-right:calc(clamp(20px,3.5vw,44px) + env(safe-area-inset-right));
    display:flex; flex-direction:column; justify-content:space-between;
  }

  /* ---------- Top bar ---------- */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }

  .clock{
    letter-spacing:0.08em;
  }
  .clock .time{
    font-family:'Jost', sans-serif;
    font-weight:300;
    font-size:clamp(20px,2.6vw,30px);
    letter-spacing:0.18em;
  }
  .clock .rule{
    width:56px; height:1px;
    background:var(--cream-dim);
    opacity:0.6;
    margin:6px 0 6px;
  }
  .clock .locale{
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--cream-dim);
    text-transform:uppercase;
  }

  .toggle{
    display:flex;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-full);
    padding:5px;
    backdrop-filter:blur(6px);
    gap:4px;
  }
  .toggle button{
    all:unset;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.14em;
    padding:8px 18px;
    border-radius:var(--radius-full);
    cursor:pointer;
    color:var(--cream-dim);
    transition:background .25s ease, color .25s ease;
  }
  .toggle button.active{
    background:linear-gradient(180deg,#efd8a6,#c99a58);
    color:#241c10;
    font-weight:500;
  }
  .toggle svg{ width:13px; height:13px; }

  /* ---------- Hero title ---------- */
  .hero{
    text-align:center;
  }
  .hero .line1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:clamp(38px,6.8vw,78px);
    letter-spacing:0.04em;
    text-shadow:0 4px 24px rgba(0,0,0,0.5);
  }
  .hero .line2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(28px,5vw,58px);
    color:var(--cream);
    margin-top:-6px;
    text-shadow:0 4px 24px rgba(0,0,0,0.5);
  }
  .hero .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:14px 0 10px;
    color:var(--dusk-amber);
  }
  .hero .divider::before,
  .hero .divider::after{
    content:"";
    width:64px; height:1px;
    background:var(--cream-dim);
    opacity:0.5;
  }
  .hero .tagline{
    font-size:clamp(13px,1.4vw,17px);
    letter-spacing:0.12em;
    color:var(--cream-dim);
  }

  /* ---------- Now Playing — minimal, centered ---------- */
  .player-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:1;
  }
  .player{
    width:min(300px, 80%);
    text-align:center;
  }
  .player .label{
    font-size:10px;
    letter-spacing:0.32em;
    color:var(--cream-dim);
    opacity:0.75;
    margin-bottom:18px;
  }
  .track-meta .title{
    font-family:'Playfair Display', serif;
    font-size:22px;
    font-weight:600;
    color:var(--cream);
  }
  .track-meta .artist{
    font-size:12.5px;
    letter-spacing:0.06em;
    color:var(--cream-dim);
    margin-top:4px;
  }

  .progress{
    margin:22px auto 6px;
    width:100%;
    max-width:220px;
    position:relative;
  }
  .progress .bar{
    height:1px;
    background:rgba(244,236,217,0.25);
    position:relative;
  }
  .progress .fill{
    position:absolute; left:0; top:0; bottom:0;
    width:29%;
    background:var(--dusk-amber);
  }
  .progress .thumb{
    position:absolute;
    left:29%; top:50%;
    width:6px; height:6px;
    background:var(--cream);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .progress .times{
    display:flex; justify-content:space-between;
    font-size:10px; color:var(--cream-dim);
    opacity:0.7;
    margin-top:8px;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    margin-top:18px;
  }
  .controls button{
    all:unset;
    cursor:pointer;
    color:var(--cream-dim);
    display:flex;
    transition:color .2s ease;
  }
  .controls button:hover{ color:var(--cream); }
  .controls .play{
    color:var(--cream);
    width:34px; height:34px;
    align-items:center;
    justify-content:center;
  }
  .controls svg{ width:14px; height:14px; }
  .controls .play svg{ width:22px; height:22px; }

  .like{
    width:16px; height:16px;
    color:var(--cream-dim);
    opacity:0.7;
    margin-top:14px;
  }

  /* ---------- Footer: quote + signature ---------- */
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-top:20px;
  }
  .quote{
    max-width:360px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(15px,1.7vw,19px);
    line-height:1.45;
    color:var(--cream);
    position:relative;
  }
  .quote .accent{ color:var(--dusk-amber); font-style:normal; font-weight:600; }
  .quote .attribution{
    display:block;
    margin-top:10px;
    font-family:'Cormorant Garamond', serif;
    font-size:14px;
    color:var(--dusk-amber-soft);
  }
  .replay{
    width:30px; height:30px;
    border:1px solid var(--glass-border);
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-left:10px;
    vertical-align:middle;
    color:var(--cream-dim);
  }
  .replay svg{ width:13px; height:13px; }

  .signature{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:20px;
    color:var(--dusk-amber);
    opacity:0.9;
  }

  /* =========================================================
     RESPONSIVE — desktop (default) → tablet → phone → small phone
     ========================================================= */

  /* Tablet / small laptop */
  @media (max-width:900px){
    body{ padding:16px; }
    .poster{ border-radius:10px; }
    .player{ width:min(280px, 85%); }
    .quote{ max-width:300px; }
  }

  /* Phone — poster goes edge-to-edge and fills the screen height,
     landscape aspect-ratio is dropped in favor of the device's own shape */
  @media (max-width:680px){
    body{ padding:0; }
    .poster{
      width:100vw;
      max-width:none;
      aspect-ratio:auto;
      height:100vh;
      height:100dvh;
      border-radius:0;
      box-shadow:none;
    }

    .top-bar{ flex-direction:row; align-items:center; }
    .clock .time{ font-size:18px; letter-spacing:0.14em; }
    .clock .rule{ width:40px; margin:5px 0; }
    .clock .locale{ font-size:9.5px; }

    .toggle button{ padding:7px 12px; font-size:11px; gap:6px; }

    .hero .line1{ font-size:clamp(34px,11vw,48px); }
    .hero .line2{ font-size:clamp(24px,8vw,34px); }
    .hero .tagline{ font-size:12px; letter-spacing:0.08em; }
    .hero .divider::before,
    .hero .divider::after{ width:38px; }

    .player{ width:min(280px, 88%); }
    .track-meta .title{ font-size:19px; }

    .footer{ flex-direction:column; align-items:flex-start; gap:16px; padding-top:18px; }
    .quote{ max-width:100%; font-size:14.5px; }
    .signature{ font-size:17px; align-self:flex-end; }
  }

  /* Small phones */
  @media (max-width:380px){
    .layer{ padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
    .hero .line1{ font-size:30px; }
    .hero .line2{ font-size:22px; }
    .toggle button{ padding:6px 10px; font-size:10px; }
    .controls{ gap:22px; }
    .player{ width:92%; }
  }

  /* Large desktop / wide screens — let the poster breathe more */
  @media (min-width:1400px){
    .poster{ max-width:1320px; }
  }
</style>
</head>
<body>

<div class="poster">
  <div class="layer">

    <div class="top-bar">
      <div class="clock">
        <div class="time">14:55:32</div>
        <div class="rule"></div>
        <div class="locale">India · IST</div>
      </div>

      <div class="toggle">
        <button class="active">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></g></svg>
          Day
        </button>
        <button>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          Night
        </button>
      </div>
    </div>

    <div class="hero">
      <div class="line1">LONG DRIVE</div>
      <div class="line2">with her</div>
      <div class="divider">♡</div>
      <div class="tagline">one road · two hearts · endless miles</div>
    </div>

    <div class="player-wrap">
      <div class="player">
        <div class="label">NOW PLAYING</div>

        <div class="track-meta">
          <div class="title">Safarnama</div>
          <div class="artist">Lucky Ali</div>
        </div>

        <div class="progress">
          <div class="bar"><div class="fill"></div><div class="thumb"></div></div>
          <div class="times"><span>01:24</span><span>04:59</span></div>
        </div>

        <div class="controls">
          <button aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM19 6l-9 6 9 6z"/></svg>
          </button>
          <button class="play" aria-label="Pause">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
          </button>
          <button aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
          </button>
        </div>

        <svg class="like" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 21s-7.5-4.6-10-9C.5 8.5 2 4 6 4c2.2 0 3.7 1.3 4.5 2.4C11.3 5.3 12.8 4 15 4c4 0 5.5 4.5 4 8-2.5 4.4-10 9-10 9z"/>
        </svg>
      </div>
    </div>

    <div class="footer">
      <div class="quote">
        “ कुछ रास्ते <span class="accent">मंज़िल</span> के लिए नहीं,<br>
        किसी के साथ चलने के लिए होते हैं। ”
        <span class="replay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v6h6"/></svg>
        </span>
        <span class="attribution">— cinesutrachitra</span>
      </div>
      <div class="signature">cinesutrachitra</div>
    </div>

  </div>
</div>

</body>
</html>
