<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Long Drive With Her</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="experience">


    <!-- BACKGROUND -->

    <div class="background">

        <img
            id="backgroundImage"
            src="assets/bike-day-desktop.png"
            alt="Motorcycle ride through the mountains"
        >

    </div>


    <div class="cinematic-overlay"></div>

    <div class="film-grain"></div>


    <!-- CLOCK -->

    <div class="clock">

        <div id="time" class="time">
            00:00:00
        </div>

        <div class="location">
            INDIA · IST
        </div>

    </div>


    <!-- DAY / NIGHT -->

    <div class="mode-switch">

        <button
            id="dayBtn"
            class="mode active"
        >
            ☀ DAY
        </button>

        <button
            id="nightBtn"
            class="mode"
        >
            ☾ NIGHT
        </button>

    </div>


    <!-- CENTER -->

    <section class="center-content">

        <div class="small-label">
            A JOURNEY FOR TWO
        </div>


        <h1>

            <span class="title-main">
                LONG DRIVE
            </span>

            <span class="title-italic">
                WITH HER
            </span>

        </h1>


        <div class="divider">

            <span></span>

            <small>♡</small>

            <span></span>

        </div>


        <p class="tagline">
            one road · two hearts · endless miles
        </p>


        <!-- MUSIC -->

        <div class="music-player">


            <div class="now-playing">
                NOW PLAYING
            </div>


            <!-- ACTUAL YOUTUBE PLAYER -->

            <div class="youtube-wrapper">

                <div id="youtube-player"></div>

            </div>


            <!-- SONG INFORMATION -->

            <div class="music-info">

                <div class="album-art">
                    ♪
                </div>

                <div class="song-details">

                    <div
                        id="songTitle"
                        class="song-title"
                    >
                        Select a song
                    </div>

                    <div
                        id="artistName"
                        class="artist"
                    >
                        YouTube
                    </div>

                </div>

            </div>


            <!-- PROGRESS -->

            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>


            <!-- CONTROLS -->

            <div class="music-controls">

                <button
                    id="previousBtn"
                    type="button"
                >
                    ◀
                </button>


                <button
                    id="playBtn"
                    class="play-button"
                    type="button"
                >
                    ▶
                </button>


                <button
                    id="nextBtn"
                    type="button"
                >
                    ▶
                </button>

            </div>


        </div>

    </section>


    <!-- QUOTE -->

    <div class="quote-box">

        <button
            id="quoteRefresh"
            class="quote-refresh"
        >
            ↻
        </button>


        <div id="quote" class="quote">

            "कुछ रास्ते मंज़िल के लिए नहीं,
            किसी के साथ चलने के लिए होते हैं।"

        </div>


        <div class="quote-author">
            — cinesutrachitra
        </div>

    </div>


    <!-- SIGNATURE -->

    <div class="signature">
        cinesutrachitra
    </div>


    <div class="bottom-note">
        KEEP RIDING · KEEP LOVING
    </div>


</main>


<!-- YOUTUBE IFRAME API -->

<script src="https://www.youtube.com/iframe_api"></script>

<script src="script.js"></script>


</body>

</html>
