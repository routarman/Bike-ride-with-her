<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Long Drive With Her — a cinematic journey."
    >

    <title>Long Drive With Her</title>


    <!-- GOOGLE FONTS -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         MAIN WEBSITE
    ====================================== -->

    <main class="experience">


        <!-- =================================
             BACKGROUND
        ================================== -->

        <div class="background">

            <img
                id="backgroundImage"
                src="assets/bike-day-desktop.png"
                alt="Motorcycle ride"
            >

        </div>


        <!-- CINEMATIC DARK OVERLAY -->

        <div class="cinematic-overlay"></div>


        <!-- FILM GRAIN -->

        <div class="film-grain"></div>


        <!-- =================================
             LIVE CLOCK
        ================================== -->

        <div class="clock">

            <div
                id="time"
                class="time"
            >
                00:00:00
            </div>


            <div class="location">

                INDIA · IST

            </div>

        </div>


        <!-- =================================
             DAY / NIGHT
        ================================== -->

        <div class="mode-switch">


            <button
                id="dayBtn"
                class="mode active"
                type="button"
            >

                ☀ DAY

            </button>


            <button
                id="nightBtn"
                class="mode"
                type="button"
            >

                ☾ NIGHT

            </button>


        </div>


        <!-- =================================
             CENTER CONTENT
        ================================== -->

        <section class="center-content">


            <div class="small-label">

                A JOURNEY FOR TWO

            </div>


            <h1>


                <span class="title-main">

                    LONG DRIVE

                </span>


                <span class="title-italic">

                    WITH HER

                </span>


            </h1>


            <!-- DIVIDER -->

            <div class="divider">

                <span></span>

                <small>♡</small>

                <span></span>

            </div>


            <!-- TAGLINE -->

            <p class="tagline">

                one road · two hearts · endless miles

            </p>


            <!-- =================================
                 MUSIC PLAYER
            ================================== -->

            <div class="music-player">


                <div class="now-playing">

                    NOW PLAYING

                </div>


                <!-- YOUTUBE PLAYER -->

                <div class="youtube-wrapper">

                    <div id="youtube-player"></div>

                </div>


                <!-- SONG INFORMATION -->

                <div class="music-info">


                    <div class="album-art">

                        ♪

                    </div>


                    <div class="song-details">


                        <div
                            id="songTitle"
                            class="song-title"
                        >

                            Song 1

                        </div>


                        <div
                            id="artistName"
                            class="artist"
                        >

                            YouTube

                        </div>


                    </div>


                </div>


                <!-- PROGRESS -->

                <div class="progress-area">


                    <span
                        id="currentTime"
                        class="music-time"
                    >

                        0:00

                    </span>


                    <input
                        id="progress"
                        class="progress"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                    >


                    <span
                        id="duration"
                        class="music-time"
                    >

                        0:00

                    </span>


                </div>


                <!-- CUSTOM CONTROLS -->

                <div class="music-controls">


                    <button
                        id="previousBtn"
                        type="button"
                        aria-label="Previous song"
                    >

                        ◀

                    </button>


                    <button
                        id="playBtn"
                        class="play-button"
                        type="button"
                        aria-label="Play or pause"
                    >

                        ▶

                    </button>


                    <button
                        id="nextBtn"
                        type="button"
                        aria-label="Next song"
                    >

                        ▶

                    </button>


                </div>


            </div>


        </section>


        <!-- =================================
             LOVE QUOTE
        ================================== -->

        <div class="quote-box">


            <button
                id="quoteRefresh"
                class="quote-refresh"
                type="button"
                aria-label="New quote"
            >

                ↻

            </button>


            <div
                id="quote"
                class="quote"
            >

                "कुछ रास्ते मंज़िल के लिए नहीं,
                किसी के साथ चलने के लिए होते हैं।"

            </div>


            <div class="quote-author">

                — cinesutrachitra

            </div>


        </div>


        <!-- =================================
             SIGNATURE
        ================================== -->

        <div class="signature">

            cinesutrachitra

        </div>


        <!-- BOTTOM TEXT -->

        <div class="bottom-note">

            KEEP RIDING · KEEP LOVING

        </div>


    </main>


    <!-- =====================================
         YOUTUBE IFRAME API
    ====================================== -->

    <script
        src="https://www.youtube.com/iframe_api">
    </script>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
