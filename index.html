<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111">

    <title>Long Drive With Her</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- BACKGROUND -->
    <main class="hero">

        <!-- TOP LEFT CLOCK -->
        <div class="clock">
            <div id="time">00:00:00</div>

            <div class="clock-line"></div>

            <span>INDIA · IST</span>
        </div>


        <!-- DAY / NIGHT -->
        <div class="theme-switch">

            <button id="dayBtn" class="theme-btn active">
                ☀ <span>DAY</span>
            </button>

            <button id="nightBtn" class="theme-btn">
                ☾ <span>NIGHT</span>
            </button>

        </div>


        <!-- MAIN TITLE -->
        <section class="intro">

            <p class="eyebrow">
                A JOURNEY MADE FOR TWO
            </p>

            <h1>
                LONG DRIVE
                <em>WITH HER</em>
            </h1>

            <div class="title-line">
                <span></span>
                <b>♡</b>
                <span></span>
            </div>

            <p class="subtitle">
                one road · two hearts · endless miles
            </p>

        </section>


        <!-- QUOTE -->
        <div class="quote">

            <p>
                “ कुछ रास्ते मंज़िल के लिए नहीं,<br>
                किसी के साथ चलने के लिए होते हैं। ”
            </p>

            <span>— cinesutrachitra</span>

        </div>


        <!-- MUSIC PLAYER -->
        <section class="music-player">

            <div class="player-label">
                NOW PLAYING
            </div>


            <!-- SONG INFO -->
            <div class="song-info">

                <img
                    id="cover"
                    class="song-cover"
                    src="assets/safranama.jpg"
                    alt="Song cover"
                >

                <div class="song-details">

                    <h2 id="songTitle">
                        Safarnama
                    </h2>

                    <p id="artist">
                        Lucky Ali
                    </p>

                </div>

                <button
                    id="heartBtn"
                    class="heart-btn"
                    aria-label="Favorite">
                    ♡
                </button>

            </div>


            <!-- PROGRESS -->
            <div class="progress-area">

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <div class="time-row">

                    <span id="currentTime">
                        00:00
                    </span>

                    <span id="duration">
                        00:00
                    </span>

                </div>

            </div>


            <!-- CONTROLS -->
            <div class="controls">

                <button
                    id="previousBtn"
                    class="control-btn"
                    aria-label="Previous">
                    ⏮
                </button>

                <button
                    id="playBtn"
                    class="play-btn"
                    aria-label="Play">
                    ▶
                </button>

                <button
                    id="nextBtn"
                    class="control-btn"
                    aria-label="Next">
                    ⏭
                </button>

            </div>


            <!-- SEARCH -->
            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search a song..."
                    autocomplete="off"
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>


            <!-- PLAYLIST -->
            <div class="playlist">

                <div class="playlist-heading">
                    ♫ Playlist
                </div>

                <div id="playlist"></div>

            </div>

        </section>


        <!-- SIGNATURE -->
        <div class="signature">
            cinesutrachitra
            <span></span>
        </div>

    </main>


    <!-- AUDIO -->
    <audio id="audio"></audio>


    <script src="script.js"></script>

</body>
</html>
