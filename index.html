<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Long Drive With Her</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Main Website -->
    <main class="page">

        <!-- Top Bar -->
        <header class="top-bar">

            <!-- Indian Time -->
            <div class="time-box">
                <span class="time-label">INDIA</span>
                <span id="indiaTime">00:00:00</span>
            </div>

            <!-- Day / Night Toggle -->
            <button id="themeToggle" class="theme-button">
                ☀️
            </button>

        </header>


        <!-- Center Content -->
        <section class="hero">

            <p class="small-heading">
                A JOURNEY MADE FOR TWO
            </p>

            <h1>
                Long Drive
                <span>With Her</span>
            </h1>

            <p class="subtitle">
                Some roads are better when she's beside you.
            </p>

        </section>


        <!-- Love Quote -->
        <section class="quote-section">

            <div class="quote-card">

                <div class="quote-mark">“</div>

                <p id="loveQuote">
                    कुछ रास्ते मंज़िल के लिए नहीं,
                    किसी के साथ चलने के लिए होते हैं।
                </p>

                <div class="quote-bottom">

                    <span>♡</span>

                    <button id="quoteRefresh" class="refresh-button">
                        ↻
                    </button>

                </div>

            </div>

        </section>


        <!-- Music Player -->
        <section class="music-section">

            <div class="music-player">

                <div class="music-header">

                    <div>
                        <span class="music-label">
                            NOW PLAYING
                        </span>

                        <h2 id="songTitle">
                            Long Drive With Her
                        </h2>
                    </div>

                    <div class="music-icon">
                        ♪
                    </div>

                </div>


                <!-- Progress -->
                <div class="progress-container">

                    <span id="currentTime">
                        00:00
                    </span>

                    <input
                        type="range"
                        id="progressBar"
                        min="0"
                        max="100"
                        value="0"
                    >

                    <span id="duration">
                        00:00
                    </span>

                </div>


                <!-- Controls -->
                <div class="music-controls">

                    <button
                        id="previousBtn"
                        class="control-button"
                        title="Previous"
                    >
                        ⏮
                    </button>

                    <button
                        id="playBtn"
                        class="play-button"
                        title="Play"
                    >
                        ▶
                    </button>

                    <button
                        id="nextBtn"
                        class="control-button"
                        title="Next"
                    >
                        ⏭
                    </button>

                </div>


                <!-- Volume -->
                <div class="volume-control">

                    <span>🔊</span>

                    <input
                        type="range"
                        id="volumeBar"
                        min="0"
                        max="100"
                        value="80"
                    >

                </div>


                <!-- Search -->
                <div class="music-search">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search a song..."
                    >

                    <button id="searchBtn">
                        Search
                    </button>

                </div>


                <!-- Search Results -->
                <div
                    id="searchResults"
                    class="search-results"
                ></div>


                <!-- Playlist -->
                <div class="playlist-container">

                    <div class="playlist-title">
                        ♫ Playlist
                    </div>

                    <div id="playlist"></div>

                </div>

            </div>

        </section>


        <!-- Hidden YouTube Player -->
        <div
            id="youtube-wrapper"
            class="youtube-wrapper"
        >

            <div id="youtube-player"></div>

        </div>


        <!-- Signature -->
        <footer class="signature">

            <span>captured & created by</span>

            <strong>
                @cinesutrachitra
            </strong>

        </footer>

    </main>


    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
