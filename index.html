<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Long Drive With Her</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <!-- =========================
         CLOCK
    ========================== -->

    <div class="clock">
        <div class="clock-time" id="clockTime">
            14:55:32
        </div>

        <div class="clock-line"></div>

        <div class="clock-location">
            INDIA · IST
        </div>
    </div>


    <!-- =========================
         DAY / NIGHT SWITCH
    ========================== -->

    <div class="theme-switch">

        <button
            class="theme-btn active"
            id="dayBtn"
            type="button"
        >
            <span>☀</span>
            DAY
        </button>

        <button
            class="theme-btn"
            id="nightBtn"
            type="button"
        >
            <span>☾</span>
            NIGHT
        </button>

    </div>


    <!-- =========================
         HERO
    ========================== -->

    <main class="hero">

        <h1 class="title">
            LONG DRIVE

            <span class="title-italic">
                WITH HER
            </span>
        </h1>


        <div class="subtitle">
            one road · two hearts · endless miles
        </div>


        <div class="heart-line">
            <span class="heart">♡</span>
        </div>


        <!-- =========================
             MUSIC PLAYER
        ========================== -->

        <div class="music-player">

            <div class="player-label">
                NOW PLAYING
            </div>


            <!-- Song information -->

            <div class="song-info">

                <img
                    id="songCover"
                    class="song-cover"
                    src="assets/song1.jpg"
                    alt="Song cover"
                >

                <div class="song-details">

                    <div
                        class="song-name"
                        id="songName"
                    >
                        Safarnama
                    </div>

                    <div
                        class="artist-name"
                        id="artistName"
                    >
                        Lucky Ali
                    </div>

                </div>


                <button
                    class="favorite-btn"
                    id="favoriteBtn"
                    type="button"
                >
                    ♡
                </button>

            </div>


            <!-- Progress -->

            <div class="progress-area">

                <div
                    class="progress-bar"
                    id="progressBar"
                >

                    <div
                        class="progress"
                        id="progress"
                    ></div>

                </div>


                <div class="time-row">

                    <span id="currentTime">
                        00:00
                    </span>

                    <span id="duration">
                        00:00
                    </span>

                </div>

            </div>


            <!-- Controls -->

            <div class="controls">

                <button
                    class="control-btn"
                    id="previousBtn"
                    type="button"
                    aria-label="Previous song"
                >
                    ⏮
                </button>


                <button
                    class="play-btn"
                    id="playBtn"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>


                <button
                    class="control-btn"
                    id="nextBtn"
                    type="button"
                    aria-label="Next song"
                >
                    ⏭
                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         QUOTE
    ========================== -->

    <div class="quote">

        <span class="quote-mark">
            “
        </span>

        कुछ रास्ते मंज़िल के लिए नहीं,
        <br>

        किसी के साथ चलने के लिए होते हैं।

        <span class="quote-mark">
            ”
        </span>


        <span class="quote-author">
            — cinesutrachitra
        </span>

    </div>


    <!-- =========================
         BOTTOM DECORATION
    ========================== -->

    <div class="bottom-decoration">
        ⟳
    </div>


    <!-- =========================
         SIGNATURE
    ========================== -->

    <div class="signature">
        cinesutrachitra
    </div>

</div>


<!-- Audio element -->

<audio
    id="audioPlayer"
    preload="metadata"
></audio>


<script src="script.js"></script>

</body>
</html>
